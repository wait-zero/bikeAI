[project]
name = "bikeai"
version = "0.0.1"
description = "Seoul Ttareungi (public bike) per-station availability forecasting"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=16",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "torch>=2.3",
    "pytorch-lightning>=2.3",
    "pytorch-forecasting>=1.0",
    "geopy>=2.4",
    "holidayskr>=0.2",
    "httpx>=0.27",
    "tenacity>=9.0",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
